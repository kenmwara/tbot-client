# tbot-client configuration. Copy to config.yaml and fill in your values.
# DO NOT commit config.yaml — it contains your tokens.

operator:
  feed_url: "https://ops.tbot.trade/api/signals/feed"
  callback_base: "https://ops.tbot.trade"   # ack/executed/resolved POST here
  subscriber_token: "tbot_REPLACE_WITH_YOUR_TOKEN"

runtime:
  poll_interval_seconds: 30
  dry_run: false              # global override — true logs but doesn't trade
  log_level: "INFO"           # DEBUG | INFO | WARN | ERROR
  state_dir: "~/.tbot"        # where state.json + client.log live
  max_signal_age_seconds: 600 # reject signals older than this (matches operator TTL)

surfaces:

  # ── Kalshi (short-term parlays + singles) ────────────────────────────
  kalshi_st:
    enabled: false
    bankroll: 500.0                 # your USD allocation for this surface
    max_concurrent: 8               # local cap (cannot exceed operator's cap of 8)
    dry_run: false                  # per-surface override of runtime.dry_run
    broker:
      type: "kalshi"
      api_email: "you@example.com"
      api_password: "REPLACE_ME"
      production: false             # false = Kalshi demo environment

  # ── Kalshi (long-term political/macro) ───────────────────────────────
  kalshi_lt:
    enabled: false
    bankroll: 200.0
    max_concurrent: 30
    dry_run: false
    broker:
      type: "kalshi"                # same broker as kalshi_st; uses same creds typically
      api_email: "you@example.com"
      api_password: "REPLACE_ME"
      production: false

  # ── OANDA forex ──────────────────────────────────────────────────────
  forex:
    enabled: false
    bankroll: 1000.0
    max_concurrent: 6
    dry_run: false
    broker:
      type: "oanda"
      account_id: "REPLACE_ME"
      api_token: "REPLACE_ME"
      practice: true                # true = OANDA practice; false = live money

  # ── IBKR US equities ─────────────────────────────────────────────────
  stocks:
    enabled: false
    bankroll: 500.0
    max_concurrent: 4
    dry_run: false
    broker:
      type: "ibkr"
      # IBKR auth depends on whether you use IB Gateway, TWS, or ibeam
      gateway_url: "http://localhost:5000/v1/api"
      account_id: "REPLACE_ME"

# Optional: per-surface size-multiplier overrides. Default = 1.0 (verbatim).
# Set <1.0 to take smaller positions than the signal recommends.
size_multipliers:
  kalshi_st: 1.0
  kalshi_lt: 1.0
  forex:     1.0
  stocks:    1.0
